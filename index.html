<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Primer parcial de Principios de Programación. Versión abreviada con PascalCase: cinco puntos, ejercicios simplificados, calificación de 1,0 a 5,0 y navegación sin scroll.">
<meta name="referrer" content="no-referrer">

<title>Primer parcial · PascalCase · Nota de 1,0 a 5,0</title>
<style>:root {
  color-scheme:light; --ink:#1b2538; --muted:#65758d; --line:#e2e8f1;
  --accent:#245ce9; --accent-2:#487cfd; --soft:#eff4ff; --rgb:36,92,233;
  --base:17px; --zoom:1; --lh:1.56; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f3f6fc;-webkit-text-size-adjust:100%;isolation:isolate}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;position:relative}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
button:disabled{cursor:default;opacity:.35;box-shadow:none!important}
button svg{display:block;width:18px;height:18px;flex:none;pointer-events:none}
button span{pointer-events:none}
::selection{background:#cee3ff;color:#16243f}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.ambient::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#748fb22b .7px,transparent .7px);background-size:24px 24px;mask-image:linear-gradient(180deg,#0005,transparent 85%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.46;will-change:transform;animation:drift 22s ease-in-out infinite alternate}
.orb.one{height:48vw;width:48vw;left:-23vw;top:-32vw;background:#c7d7ff}
.orb.two{height:38vw;width:38vw;right:-20vw;bottom:-18vw;background:#b9e7f0;animation-delay:-9s}
.orb.three{height:22vw;width:35vw;left:35%;top:-23vw;background:#dfccf8;animation-delay:-15s}
@keyframes drift{to{transform:translate(6vw,5vh) scale(1.14)}}
.app{width:100%;max-width:1310px;height:100vh;height:100dvh;margin:0 auto;padding:20px 30px 17px;display:flex;flex-direction:column;gap:13px;overflow:hidden}
.window-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:34px;flex:none}
.brand{display:flex;align-items:center;gap:17px;min-width:0}
.dots{display:flex;gap:7px;flex:none}.dot{width:10px;height:10px;border-radius:50%;box-shadow:inset 0 0 0 1px #0000000a}.red{background:#ff625c}.yellow{background:#ffbe35}.green{background:#2cc64d}
.course{color:#677992;font-size:10px;letter-spacing:.13em;font-weight:700}
.tools{display:flex;gap:6px;align-items:center;flex:none}
.read-only{display:flex;align-items:center;gap:6px;font-size:10px;color:#6a7b91;padding-right:7px;white-space:nowrap}
.read-only svg{width:13px;height:13px}
.tool{min-width:34px;height:34px;border:1px solid #dce4f0;background:#ffffffb5;border-radius:10px;color:#536880;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,transform .18s,border-color .18s;overflow:hidden;padding:0 8px}
.tool:hover{background:#fff;border-color:#b2c9e9;transform:translateY(-1px)}
.tool[aria-pressed=true]{background:var(--soft);color:var(--accent);border-color:#b9cde9}
.tool span{font-size:11px;font-weight:650}
.text-size{display:flex;gap:2px;align-items:center}
.text-size .tool{font-size:12px;font-weight:750;width:32px;min-width:32px;padding:0}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;flex:none;min-height:65px;padding:2px 0 5px}
h1{font-size:35px;letter-spacing:-.055em;font-weight:760;line-height:1.12;margin:0}
h1 .period{color:var(--accent)}
.masthead p{font-size:12px;color:var(--muted);margin:6px 0 0}
.metadata{display:flex;gap:7px;flex:none;align-items:center}
.metadata span{font-size:11px;color:#465974;background:#ffffffcc;border:1px solid #dfe6f1;box-shadow:0 2px 4px #2d406305;border-radius:10px;padding:9px 11px;font-weight:550;display:flex;align-items:center;gap:7px;white-space:nowrap}
.metadata svg{width:14px;height:14px;color:#7386a5;flex:none}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:5px;background:#e9eef7bf;border:1px solid #e0e7f3;box-shadow:inset 0 1px 0 #fff;border-radius:15px;position:relative;flex:none;isolation:isolate}
.tab-highlight{position:absolute;left:0;top:5px;bottom:5px;border-radius:11px;background:var(--accent);box-shadow:0 4px 12px rgba(var(--rgb),.19),inset 0 1px 0 #ffffff22;z-index:0;transition:transform .4s var(--ease),width .4s var(--ease),background .32s;pointer-events:none}
.tab{min-width:0;border:0;background:transparent;color:#5b6d86;font-size:12px;font-weight:650;border-radius:11px;min-height:39px;padding:9px 5px;z-index:1;display:flex;gap:8px;align-items:center;justify-content:center;transition:color .25s,background .2s;overflow:hidden}
.tab svg{height:16px;width:16px;opacity:.9}
.tab:hover:not([aria-current=page]){background:#ffffffb0;color:#263d5e}
.tab[aria-current=page]{color:white}
.tab .mobile-label{display:none}
.viewer{position:relative;min-height:0;flex:1;display:flex;flex-direction:column;padding:23px 30px 18px;background:#fff;border:1px solid #e0e7f0;border-radius:22px;box-shadow:0 22px 50px -30px #273c6655,0 4px 12px #273c6505;overflow:hidden}
.viewer::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);opacity:.55;transition:background .35s;pointer-events:none}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none;border-bottom:1px solid #edf1f6;padding-bottom:17px;margin-bottom:18px;min-height:72px;position:relative}
.heading-copy{min-width:0}
.kicker{display:flex;align-items:center;gap:8px;font-size:10px;line-height:1.4;font-weight:700;letter-spacing:.10em;text-transform:uppercase;color:var(--accent);margin:0 0 7px}
.kicker::before{content:"";height:6px;width:6px;flex:none;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.section-heading h2{font-size:29px;letter-spacing:-.045em;line-height:1.16;font-weight:730;margin:0;color:#1d2a40}
.heading-side{display:flex;align-items:center;gap:16px;flex:none}
.section-number{font-size:53px;letter-spacing:-.07em;line-height:1;color:var(--soft);font-weight:760;user-select:none}
.score{display:flex;align-items:center;gap:5px;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;padding:9px 13px;border-radius:11px;white-space:nowrap;flex:none;border:1px solid rgba(var(--rgb),.09)}
.viewport{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:pan-y pinch-zoom}
.page{position:absolute;inset:0;font-size:calc(var(--base)*var(--zoom));line-height:var(--lh);overflow-wrap:anywhere}
.page-inner{display:flow-root;padding:0 2px 4px}
.group{margin:0 0 17px;position:relative}.group:last-child{margin-bottom:0}
.group+.group{padding-top:15px;border-top:1px solid #edf1f7}
h3{font-size:calc(12.5px*var(--zoom));line-height:1.45;color:#536784;letter-spacing:.015em;font-weight:750;margin:0 0 9px;display:flex;gap:8px;align-items:center}
h3 .cont{font-weight:500;color:#7a8ba4;font-size:10px;letter-spacing:0}
.task-group{padding-left:43px;min-height:30px;margin-bottom:12px}
.task-group h3{position:absolute;left:0;top:0;height:28px;min-width:28px;border:1px solid rgba(var(--rgb),.11);border-radius:8px;background:var(--soft);color:var(--accent);justify-content:center;letter-spacing:0;padding:0 6px;font-size:12px}
.task-group+.task-group{padding-top:12px}.task-group+.task-group h3{top:12px}
.task-group h3 .cont{display:none}
.block{margin:0 0 11px}.block:last-child{margin-bottom:0}
p{margin:0}strong{font-weight:670}
code{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;color:#304e78;font-size:.93em;background:#f0f4f9;padding:2px 5px;border-radius:5px;overflow-wrap:anywhere;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.intro-lead{font-size:clamp(26px,3.25vw,44px);line-height:1.15;letter-spacing:-.05em;font-weight:720;max-width:800px;margin:6px 0 18px;color:#22365d}
.page[data-section=inicio] .group:first-child{padding:5px 0 9px}
.page[data-section=inicio] .group:nth-child(2){background:#f7f9ff;border:1px solid #e7edf8;border-radius:14px;padding:16px 18px}
.code-box{border:1px solid #dce5f0;border-radius:12px;overflow:hidden;background:#f7f9fd;box-shadow:0 4px 10px #172b4603}
.code-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 15px;background:#eef3fa;border-bottom:1px solid #dee7f2;color:#61728b;font-size:10px;letter-spacing:.02em;line-height:1.3;font-weight:600}
.code-head .code-language{display:flex;align-items:center;gap:8px}
.code-symbol{color:var(--accent);font:700 13px ui-monospace,Consolas,monospace}
.code-box pre{margin:0;padding:14px 17px;font:calc(14.5px*var(--zoom))/1.66 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;tab-size:4;color:#2c405a}
.code-box code{font:inherit;color:inherit;background:none;padding:0;border-radius:0;box-decoration-break:slice;-webkit-box-decoration-break:slice}
.tok-kw{color:#7543aa;font-weight:600}.tok-str{color:#147367}.tok-num{color:#a65712}.tok-fn{color:#255eb3}.tok-comment{color:#687991;font-style:italic}

table{border-collapse:collapse;width:100%;table-layout:fixed;line-height:1.47;font-size:calc(15px*var(--zoom))}
th{text-align:left;font-weight:700;background:var(--soft);color:var(--accent);font-size:calc(11px*var(--zoom));letter-spacing:.035em;padding:10px 15px;border-bottom:1px solid #dee7f1}
th:first-child:not(:last-child){width:30%}
td{padding:11px 15px;vertical-align:top;border-bottom:1px solid #eaf0f7;overflow-wrap:anywhere;transition:background .18s}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even){background:#fafbfd}
tbody tr:hover td{background:var(--soft)}
.expression{display:flex;gap:16px;align-items:center;background:#f7f9fd;border:1px solid #e7edf7;padding:9px 13px;border-radius:9px;transition:border-color .2s,background .2s}
.expression:hover{border-color:rgba(var(--rgb),.25);background:var(--soft)}

.file{display:flex;align-items:center;gap:13px;border:1px solid #dde6f0;border-radius:12px;background:#f8fafd;padding:13px 16px;font-size:calc(14px*var(--zoom));transition:border-color .2s,background .2s}

.note{background:var(--soft);border:1px solid rgba(var(--rgb),.10);border-left:3px solid var(--accent);color:#415675;border-radius:0 9px 9px 0;padding:13px 16px;font-size:calc(14px*var(--zoom))}
.small-note{font-size:11px;color:#70829c}
.viewer-progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:#eef2f9;overflow:hidden}
.viewer-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .55s var(--ease),background .3s;position:relative}
.viewer-progress span::after{content:"";position:absolute;top:0;bottom:0;right:0;width:60px;background:linear-gradient(90deg,transparent,#ffffffa0);animation:glint 4s ease-in-out infinite}

.pager{display:grid;grid-template-columns:155px 1fr 155px;align-items:center;gap:14px;min-height:53px;flex:none}
.move{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:650;border:1px solid #d7e1f0;border-radius:13px;min-height:46px;padding:11px 18px;background:#ffffffdb;color:#506480;overflow:hidden;transition:transform .18s,box-shadow .18s,background .2s}
.move.primary{color:white;border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 5px 14px rgba(var(--rgb),.19)}
.move:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 17px #29476e19}
.move.primary:hover:not(:disabled){box-shadow:0 8px 19px rgba(var(--rgb),.25)}
.move:active:not(:disabled){transform:translateY(0) scale(.985)}
.move.primary svg{transition:transform .2s}.move.primary:hover svg{transform:translateX(3px)}
.page-info{display:flex;justify-content:center;align-items:center;gap:13px;min-width:0}

.journey-ring .ring-fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s var(--ease),stroke .3s}
.page-count{display:block;font-size:11px;font-weight:650;color:#405573}
.page-hint{display:block;color:#7d8ba1;font-size:10px;margin-top:2px}
.page-dots{display:flex;justify-content:center;align-items:center;gap:3px;margin-top:4px;min-height:13px}
.page-dot{border:0;padding:4px 3px;background:none;display:flex;align-items:center;justify-content:center;width:22px;height:16px}
.page-dot::after{content:"";width:6px;height:6px;border-radius:9px;background:#cbd7e7;transition:width .3s var(--ease),background .3s}
.page-dot[aria-current=page]{width:28px}.page-dot[aria-current=page]::after{background:var(--accent);width:19px}

.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.13;pointer-events:none;transform:scale(0);animation:ripple .55s var(--ease) forwards}
@keyframes ripple{to{transform:scale(2.5);opacity:0}}
.toast{position:fixed;top:16px;bottom:auto;left:50%;transform:translate(-50%,10px);background:#1b2b44;color:white;border:1px solid #ffffff1a;padding:10px 16px;border-radius:11px;font-size:12px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 9px 28px #142a4533;opacity:0;pointer-events:none;z-index:30;transition:opacity .2s,transform .2s}

.noscript{position:fixed;inset:15%;display:grid;place-content:center;background:white;border:1px solid #dde5f1;border-radius:16px;padding:25px;z-index:30;line-height:1.55}
.app.focus-mode .masthead{display:none}
.app.focus-mode .course::after{content:" · ENFOQUE";color:var(--accent)}
.app.focus-mode .window-bar{min-height:28px}
html[data-motion=off] *,html[data-motion=off] *::before,html[data-motion=off] *::after,html[data-measuring=true] *,html[data-measuring=true] *::before,html[data-measuring=true] *::after{animation:none!important;transition:none!important}

<script>'use strict';
// Solo presentación: sin formularios, almacenamiento, red ni evaluación de respuestas.
const SECTIONS = [{"id": "inicio", "label": "Inicio", "title": "Antes de empezar", "kicker": "Primer seguimiento · Python", "score": "Nota 1,0–5,0", "groups": [{"title": "", "blocks": [{"type": "html", "html": "<div class=\"intro-lead\">Si puedes imaginarlo <span class=\"motivation-accent\">puedes programarlo<\/span><\/div>", "id": "inicio-g0-b0"}, {"type": "html", "html": "<p><strong>120 minutos · Individual · Sin IA.<\/strong><\/p>", "id": "inicio-g0-b1"}, {"type": "html", "html": "<p>Esta página solo muestra el parcial. Resuelve en tu documento y en Python. Entrega los archivos en la tarea de Moodle.<\/p>", "id": "inicio-g0-b2"}], "id": "inicio-g0"}, {"title": "Instrucciones", "blocks": [{"type": "html", "html": "<p><strong>Puntos 1–2:<\/strong> sin ejecutar código. <strong>Puntos 3–5:<\/strong> puedes usar Python.<\/p>", "id": "inicio-g1-b0"}, {"type": "html", "html": "<p>Supón datos numéricos bien escritos, con punto decimal, y nombre no vacío. No se requieren ciclos, listas, funciones propias ni excepciones.<\/p>", "id": "inicio-g1-b1"}, {"type": "html", "html": "<p><strong>Nombres en PascalCase:<\/strong> <code>NotaFinal<\/code>, <code>TotalCompra<\/code> y <code>PrecioUnitario<\/code>.<\/p>", "id": "inicio-g1-b2"}, {"type": "html", "html": "<p class=\"grading-note\"><strong>Nota: de 1,0 a 5,0, con decimales.<\/strong> Cada punto se califica en esa escala. Pesos: 15 %, 20 %, 15 %, 20 % y 30 %, respectivamente. Se calcula el promedio ponderado.<\/p>", "id": "inicio-g1-calificacion"}], "id": "inicio-g1"}], "scoreHelp": "Escala de calificación de 1,0 a 5,0, con decimales."}, {"id": "punto-1", "label": "Punto 1", "title": "Conceptos y datos", "kicker": "Punto 1 · Sin ejecutar código", "score": "Máx. 0,75", "groups": [{"title": "a.", "blocks": [{"type": "html", "html": "<p>Defina: <strong>algoritmo, pseudocódigo, diagrama de flujo y programa<\/strong>.<\/p>", "id": "punto-1-g0-b0"}], "id": "punto-1-g0"}, {"title": "b.", "blocks": [{"type": "html", "html": "<p>Indica el tipo de cada valor: <code>12<\/code>, <code>\"12\"<\/code>, <code>12.0<\/code>, <code>True<\/code>.<\/p>", "id": "punto-1-g1-b0"}], "id": "punto-1-g1"}, {"title": "c.", "blocks": [{"type": "html", "html": "<p>Explica la diferencia entre <code>=<\/code> y <code>==<\/code>. Escribe un ejemplo de cada uno.<\/p>", "id": "punto-1-g2-b0"}], "id": "punto-1-g2"}, {"title": "d.", "blocks": [{"type": "html", "html": "<p>Declara una constante con valor <strong>500<\/strong>. ¿Python impide reasignarla?<\/p>", "id": "punto-1-g3-b0"}], "id": "punto-1-g3"}], "scoreHelp": "Peso: 15 %. Calificación del punto: de 1,0 a 5,0. Aporte máximo a la nota final: 0,75."}, {"id": "punto-2", "label": "Punto 2", "title": "Lee y predice", "kicker": "Punto 2 · Sin ejecutar código", "score": "Máx. 1,00", "groups": [{"title": "a. Entrada y conversión", "blocks": [{"type": "html", "html": "<p>Se ingresa <strong>12<\/strong>. Indica las dos salidas y los tipos de <code>Dato<\/code> y <code>Numero<\/code>.<\/p>", "id": "punto-2-g0-b0"}, {"type": "code", "text": "Dato = input(\"Número: \")\nprint(Dato * 2)\nNumero = int(Dato)\nprint(Numero + 3)", "caption": "Python", "id": "punto-2-g0-b1"}, {"type": "html", "html": "<p>No incluyas los mensajes de <code>input()<\/code>.<\/p>", "id": "punto-2-g0-b2"}], "id": "punto-2-g0"}, {"title": "b. Trazabilidad", "blocks": [{"type": "html", "html": "<p>Registra <code>Saldo<\/code> y <code>Copia<\/code> después de cada línea señalada. Escribe las dos salidas finales.<\/p>", "id": "punto-2-g1-b0"}, {"type": "code", "text": "Saldo = 10000\nCopia = Saldo\nSaldo -= 2500\nSaldo += 500\nprint(Saldo)\nprint(Copia)", "caption": "Python", "id": "punto-2-g1-b1"}, {"type": "html", "html": "<p>Líneas: <code>Copia = Saldo<\/code>, <code>Saldo -= 2500<\/code> y <code>Saldo += 500<\/code>.<\/p>", "id": "punto-2-g1-b2"}], "id": "punto-2-g1"}, {"title": "c. Operadores", "blocks": [{"type": "html", "html": "<p>Calcula:<\/p>", "id": "punto-2-g2-b0"}, {"type": "html", "html": "<p class=\"expression\"><span class=\"expression-number\">01<\/span><code>7 + 3 * 2<\/code><\/p>", "id": "punto-2-g2-b1"}, {"type": "html", "html": "<p class=\"expression\"><span class=\"expression-number\">02<\/span><code>135 // 60<\/code><\/p>", "id": "punto-2-g2-b2"}, {"type": "html", "html": "<p class=\"expression\"><span class=\"expression-number\">03<\/span><code>135 % 60<\/code><\/p>", "id": "punto-2-g2-b3"}, {"type": "html", "html": "<p class=\"expression\"><span class=\"expression-number\">04<\/span><code>8 &gt; 5<\/code><\/p>", "id": "punto-2-g2-b4"}], "id": "punto-2-g2"}], "scoreHelp": "Peso: 20 %. Calificación del punto: de 1,0 a 5,0. Aporte máximo a la nota final: 1,00."}, {"id": "punto-3", "label": "Punto 3", "title": "Corrige el programa", "kicker": "Punto 3 · Depuración", "score": "Máx. 0,75", "groups": [{"title": "El problema", "blocks": [{"type": "html", "html": "<p>Cada unidad cuesta <strong>$1.200<\/strong>. Aprueba la compra si el pago es <strong>igual o mayor al total<\/strong>. La cantidad es un entero positivo y el pago, un entero no negativo.<\/p>", "id": "punto-3-g0-b0"}], "id": "punto-3-g0"}, {"title": "Código para corregir", "blocks": [{"type": "code", "text": "Cantidad = input(\"Cantidad: \")\nPrecioUnitario = 1200\nTotalCompra = Cantidad * PrecioUnitario\nPagoCliente = int(input(\"Pago: \"))\nif PagoCliente > TotalCompra\nprint(\"Compra aprobada\")\nelse:\n    print(\"Dinero insuficiente\")", "caption": "Python · Contiene errores", "id": "punto-3-g1-b0"}], "id": "punto-3-g1"}, {"title": "Desarrolla", "blocks": [{"type": "html", "html": "<p><strong>a.<\/strong> Identifica los <strong>cuatro errores<\/strong>.<\/p>", "id": "punto-3-g2-b0"}, {"type": "html", "html": "<p><strong>b.<\/strong> Escribe y ejecuta el programa corregido.<\/p>", "id": "punto-3-g2-b1"}, {"type": "html", "html": "<p><strong>c.<\/strong> Prueba con <strong>2 unidades y $2.400<\/strong>. Indica la salida.<\/p>", "id": "punto-3-g2-b2"}], "id": "punto-3-g2"}], "scoreHelp": "Peso: 15 %. Calificación del punto: de 1,0 a 5,0. Aporte máximo a la nota final: 0,75."}, {"id": "punto-4", "label": "Punto 4", "title": "Diseña una solución", "kicker": "Punto 4 · Pseudocódigo y diagrama", "score": "Máx. 1,00", "groups": [{"title": "Préstamo de portátiles", "blocks": [{"type": "html", "html": "<p>Una biblioteca presta portátiles. Con carné inactivo responde <strong>“Préstamo no autorizado”<\/strong>, aunque no haya equipos. Con carné activo y al menos un equipo responde <strong>“Préstamo aprobado”<\/strong>; si no hay equipos, <strong>“Sin equipos disponibles”<\/strong>.<\/p>", "id": "punto-4-g0-b0"}, {"type": "html", "html": "<p>Emite un solo mensaje. El carné se ingresa como <code>\"si\"<\/code> o <code>\"no\"<\/code>; los equipos, como un entero igual o mayor que cero.<\/p>", "id": "punto-4-g0-b1"}], "id": "punto-4-g0"}, {"title": "Desarrolla", "blocks": [{"type": "html", "html": "<p><strong>a.<\/strong> Identifica <strong>entradas y tipos, proceso y salidas<\/strong>.<\/p>", "id": "punto-4-g1-b0"}, {"type": "html", "html": "<p><strong>b.<\/strong> Escribe el pseudocódigo.<\/p>", "id": "punto-4-g1-b1"}, {"type": "html", "html": "<p><strong>c.<\/strong> Dibuja el diagrama de flujo con flechas y ramas <strong>Sí / No<\/strong>.<\/p>", "id": "punto-4-g1-b2"}, {"type": "html", "html": "<p><strong>d.<\/strong> Propón <strong>una prueba por salida<\/strong>: entradas y mensaje esperado.<\/p>", "id": "punto-4-g1-b3"}], "id": "punto-4-g1"}], "scoreHelp": "Peso: 20 %. Calificación del punto: de 1,0 a 5,0. Aporte máximo a la nota final: 1,00."}, {"id": "punto-5", "label": "Punto 5", "title": "Programa y prueba", "kicker": "Punto 5 · Caso integrador", "score": "Máx. 1,50", "groups": [{"title": "Centro de impresión", "blocks": [{"type": "html", "html": "<p>Crea un programa para un <strong>centro de impresión<\/strong>. Recibe <strong>nombre, cantidad de copias y pago<\/strong>. Procesa un solo pedido.<\/p>", "id": "punto-5-g0-b0"}], "id": "punto-5-g0"}, {"title": "Reglas del pedido", "blocks": [{"type": "table", "head": ["Regla", "Valor"], "rows": [["Precio por copia", "$200"], ["Cantidad válida", "Entero entre <strong>1 y 500<\/strong>, incluidos ambos límites."], ["Pago válido", "Igual o mayor que cero."], ["Descuento", "<strong>10 %<\/strong> del subtotal desde <strong>100 copias<\/strong>; en las demás, 0 %."], ["Tipo de pedido", "<strong>Pequeño:<\/strong> 1–20 · <strong>Mediano:<\/strong> 21–99 · <strong>Grande:<\/strong> 100–500"]], "id": "punto-5-g1-b0"}], "id": "punto-5-g1"}, {"title": "Salidas del programa", "blocks": [{"type": "html", "html": "<p><strong>a.<\/strong> Con datos inválidos, muestra solo <strong>“Datos inválidos”<\/strong>, sin calcular la compra.<\/p>", "id": "punto-5-g2-b0"}, {"type": "html", "html": "<p><strong>b.<\/strong> Con datos válidos, muestra <strong>nombre, tipo de pedido, subtotal, descuento y total<\/strong>.<\/p>", "id": "punto-5-g2-b1"}, {"type": "html", "html": "<p><strong>c.<\/strong> Si el pago alcanza, muestra <strong>“Pago suficiente”<\/strong> y el cambio. Si no, muestra <strong>“Pago insuficiente”<\/strong> y el faltante.<\/p>", "id": "punto-5-g2-b2"}], "id": "punto-5-g2"}, {"title": "Estructuras requeridas", "blocks": [{"type": "html", "html": "<div><strong>Usa dos constantes y los cuatro condicionales.<\/strong> Simple: descuento. Múltiple: tipo de pedido. Doble: pago. Anidado: decisiones dentro del caso de datos válidos.<\/div>", "id": "punto-5-g3-b0"}], "id": "punto-5-g3"}, {"title": "Pruebas obligatorias", "blocks": [{"type": "html", "html": "<p>Ejecuta estos tres pedidos con un nombre no vacío:<\/p>", "id": "punto-5-g4-b0"}, {"type": "table", "head": ["Caso", "Copias", "Pago"], "rows": [["1", "21", "$4.000"], ["2", "100", "$18.000"], ["3", "0", "$1.000"]], "id": "punto-5-g4-b1"}, {"type": "html", "html": "<p>Registra el <strong>resultado esperado y el obtenido<\/strong> en cada caso.<\/p>", "id": "punto-5-g4-b2"}], "id": "punto-5-g4"}], "scoreHelp": "Peso: 30 %. C function toggleEffects(){effects=!effects;motionOverride=true;stopMotion();syncTools();toast(effects?'Animaciones activadas':'Animaciones pausadas');}
function toggleFocus(){
  app.classList.toggle('focus-mode');syncTools();rebuild();
  toast(app.classList.contains('focus-mode')?'Modo enfoque: más espacio para leer':'Vista completa');
}
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement){if(document.exitFullscreen)await document.exitFullscreen();}
    else if(root.requestFullscreen)await root.requestFullscreen();
    else toast('Pantalla completa no disponible en este navegador.');
  }catch(error){toast('Usa la opción de pantalla completa de tu navegador.');}
}
for(const sec of SECTIONS){
  const btn=document.createElement('button');btn.type='button';btn.className='tab';btn.dataset.section=sec.id;
  btn.setAttribute('aria-label',sec.label+(sec.id.startsWith('punto')?'. '+sec.title:''));
  btn.innerHTML=icon(sec.id==='inicio'?'home':sec.id==='entrega'?'upload':({
    'punto-1':'book','punto-2':'eye','punto-3':'code','punto-4':'nodes','punto-5':'terminal'
  })[sec.id]);
  btn.append(text('span',sec.label,'desktop-label'),text('span',sec.label.replace('Punto ',''),'mobile-label'));
  btn.addEventListener('click',()=>show(pages.findIndex(p=>p.sec.id===sec.id)));
  tabs.append(btn);sectionButtons.push(btn);
}
previous.addEventListener('click',()=>show(index-1));next.addEventListener('click',()=>show(index+1));
motionButton.addEventListener('click',toggleEffects);focusButton.addEventListener('click',toggleFocus);
fullscreenButton.addEventListener('click',toggleFullscreen);
document.getElementById('zoom-out').addEventListener('click',()=>setZoom(zoom-.10));
document.getElementById('zoom-in').addEventListener('click',()=>setZoom(zoom+.10));
document.addEventListener('fullscreenchange',()=>{
  fullscreenButton.setAttribute('aria-pressed',String(Boolean(document.fullscreenElement)));
  fullscreenButton.title=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';
  fullscreenButton.setAttribute('aria-label',fullscreenButton.title);rebuild();
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.altKey||e.metaKey||e.defaultPrevented)return;
  if(['ArrowRight','PageDown','ArrowLeft','PageUp','Home','End'].includes(e.key))e.preventDefault();
  if(e.key==='ArrowRight'||e.key==='PageDown')show(index+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp')show(index-1);
  if(e.key==='Home')show(0);if(e.key==='End')show(pages.length-1);
  if(e.key==='Escape'&&app.classList.contains('focus-mode')&&!document.fullscreenElement)toggleFocus();
});
let touchStart=null;
viewport.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchStart={x:e.clientX,y:e.clientY};});
viewport.addEventListener('pointerup',e=>{
  if(!touchStart||e.pointerType!=='touch')return;
  const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;touchStart=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6&&!window.getSelection().toString())show(index+(dx<0?1:-1));
});
viewport.addEventListener('pointercancel',()=>touchStart=null);
document.addEventListener('click',e=>{
  const btn=e.target.closest('button');if(!btn||btn.disabled||!effects||btn.classList.contains('page-dot'))return;
  const rect=btn.getBoundingClientRect(),d=Math.max(rect.width,rect.height);
  const ripple=document.createElement('span');ripple.className='ripple';ripple.setAttribute('aria-hidden','true');
  ripple.style.width=ripple.style.height=d+'px';
  ripple.style.left=((e.detail?e.clientX-rect.left:rect.width/2)-d/2)+'px';
  ripple.style.top=((e.detail?e.clientY-rect.top:rect.height/2)-d/2)+'px';
  btn.append(ripple);setTimeout(()=>ripple.remove(),600);
});
function showFailure(error){busy=false;root.dataset.measuring='false';document.getElementById('size-warning').hidden=false;document.getElementById('size-warning-text').textContent=error.message;}
function rebuild(){clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{try{paginate();}catch(error){showFailure(error);}},100);}
window.addEventListener('resize',rebuild);
if(window.visualViewport)window.visualViewport.addEventListener('resize',rebuild);
document.addEventListener('visibilitychange',()=>{root.dataset.hidden=String(document.hidden);});
function onMotionPreference(e){if(!motionOverride){effects=!e.matches;stopMotion();syncTools();}}
if(motionQuery.addEventListener)motionQuery.addEventListener('change',onMotionPreference);
else if(motionQuery.addListener)motionQuery.addListener(onMotionPreference);
syncTools();
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{
  try{paginate();if(effects)animateIn(pages[index]);}catch(error){showFailure(error);}
});
</script>
</body>
</html>
